name: Community Reply Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Generate a safe community response
        uses: actions/github-script@v7
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload;
            const issue = payload.issue || payload.pull_request;
            const comment = payload.comment || payload.review_comment;
            const title = issue?.title || 'Pull request discussion';
            const body = issue?.body || '';
            const incoming = comment?.body || body;
            const author = issue?.user?.login || comment?.user?.login || 'contributor';
            const url = issue?.html_url || context.payload.repository.html_url;
            const lower = `${title}\n${incoming}`.toLowerCase();
            const kind = /(bug|error|fail|broken|exception|traceback|not work)/.test(lower)
              ? 'bug report'
              : /(how|what|why|can i|question|help)/.test(lower)
                ? 'question'
                : 'community contribution';

            let reply = `Thanks @${author} for the ${kind}. We have received it and will review it.\n\n`;
            if (kind === 'bug report') {
              reply += 'Please include the exact command or endpoint, expected versus actual behavior, relevant logs with secrets redacted, and the project version or commit. Please only include details from authorized systems.';
            } else if (kind === 'question') {
              reply += 'Please share the smallest reproducible example, your environment, and the documentation section you tried. Avoid posting API keys, tokens, private logs, or target information.';
            } else {
              reply += 'A maintainer will review this thread. Contributions and feedback are welcome; please keep examples limited to authorized defensive use.';
            }
            reply += `\n\nReference: ${url}`;

            if (process.env.LLM_API_URL && process.env.LLM_API_KEY && process.env.LLM_MODEL) {
              const prompt = `You are a cautious open-source maintainer for a defensive cybersecurity project. Draft one concise English reply to this GitHub ${kind}. Do not provide exploit steps, credential attacks, evasion, or instructions to access unauthorized systems. Do not invent facts. Ask for missing reproducible details when needed. Never repeat secrets.\n\nTitle: ${title}\nContent: ${incoming}`;
              const response = await fetch(process.env.LLM_API_URL, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'authorization': `Bearer ${process.env.LLM_API_KEY}`,
                },
                body: JSON.stringify({
                  model: process.env.LLM_MODEL,
                  messages: [{ role: 'user', content: prompt }],
                  temperature: 0.1,
                }),
              });
              if (response.ok) {
                const data = await response.json();
                const generated = data?.choices?.[0]?.message?.content?.trim();
                if (generated && generated.length <= 4000) reply = `${generated}\n\n_An automated first response; a maintainer will follow up._`;
              }
            }

            if (payload.issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: payload.issue.number,
                body: reply,
              });
            } else if (payload.pull_request_review_comment) {
              await github.rest.pulls.createReplyForReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: payload.pull_request.number,
                comment_id: payload.comment.id,
                body: reply,
              });
            }
