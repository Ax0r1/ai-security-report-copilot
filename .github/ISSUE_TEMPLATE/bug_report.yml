name: Bug report
description: Report a reproducible problem in an authorized defensive workflow
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please redact secrets, tokens, private logs, and target identifiers. Use only authorized systems."
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact command, endpoint, or smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, OS, deployment mode, and relevant configuration with secrets removed.
    validations:
      required: true
